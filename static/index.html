<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEDiT-inference</title>
    <!-- Use Google Fonts Inter for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>PEDiT-inference</h1>
    </header>
    <main>
        <div class="controls">
            <div class="form-group">
                <label for="modelSelect">Model Checkpoint</label>
                <select id="modelSelect">
                    <option value="PEDiT-100M-FP16.pt">PEDiT-100M-FP16.pt (FP16 - Recommended)</option>
                    <option value="PEDiT-100M-FP8.pt">PEDiT-100M-FP8.pt (FP8 - Fast &amp; Light)</option>
                    <option value="PEDiT-100M-INT8.pt">PEDiT-100M-INT8.pt (INT8 - Max Speed)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="deviceSelect">Device</label>
                <select id="deviceSelect">
                    <option value="cuda">GPU (CUDA)</option>
                    <option value="cpu">CPU</option>
                </select>
            </div>

            <div class="form-group">
                <label for="promptInput">Prompt</label>
                <textarea id="promptInput" placeholder="A beautiful landscape..."></textarea>
            </div>

            <div class="form-group">
                <label for="widthInput">Width</label>
                <input type="number" id="widthInput" value="512" step="64">
            </div>
            
            <div class="form-group">
                <label for="heightInput">Height</label>
                <input type="number" id="heightInput" value="512" step="64">
            </div>

            <div class="form-group">
                <label for="stepsInput">Steps: <span id="stepsVal" class="slider-val">8</span></label>
                <div class="slider-group">
                    <input type="range" id="stepsInput" min="1" max="50" value="8" oninput="document.getElementById('stepsVal').innerText = this.value">
                </div>
            </div>

            <div class="form-group">
                <label for="cfgInput">CFG Scale: <span id="cfgVal" class="slider-val">4.0</span></label>
                <div class="slider-group">
                    <input type="range" id="cfgInput" min="1.0" max="15.0" step="0.5" value="4.0" oninput="document.getElementById('cfgVal').innerText = parseFloat(this.value).toFixed(1)">
                </div>
            </div>

            <div class="form-group">
                <label for="seedInput">Seed</label>
                <input type="number" id="seedInput" value="42">
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="fastGenInput" checked>
                    Чистая генерация (только последний кадр)
                </label>
            </div>

            <button id="generateBtn" onclick="generate()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Generate
            </button>
            <div id="statusText" class="status"></div>
        </div>
        <div class="gallery-container">
            <!-- Final summary banner -->
            <div class="summary-banner" id="summaryBanner">
                <div class="summary-item">
                    <span class="summary-label">Total Model Gen:</span>
                    <span class="summary-value" id="totalModelTime">-</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Total VAE Time:</span>
                    <span class="summary-value" id="totalVaeTime">-</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Total Overall Time:</span>
                    <span class="summary-value" id="totalOverallTime">-</span>
                </div>
            </div>
            <div class="gallery" id="gallery">
                <!-- Frames will appear here -->
            </div>
        </div>
    </main>

    <!-- Modal for Zoomed Image -->
    <div id="imageModal" class="modal">
        <button class="close-modal" onclick="closeModal()">×</button>
        <div class="modal-content-wrapper">
            <img id="modalImage" class="modal-content" src="" alt="Zoomed view">
        </div>
        <div class="modal-controls">
            <button onclick="zoomOut()" title="Zoom Out">
                <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
            </button>
            <button onclick="zoomReset()" title="Reset Zoom">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>
            <button onclick="zoomIn()" title="Zoom In">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            <button onclick="downloadModalImage()" title="Download">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
